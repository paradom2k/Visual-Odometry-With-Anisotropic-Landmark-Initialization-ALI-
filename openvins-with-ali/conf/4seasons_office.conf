# openvins_ali -- run configuration for 4Seasons recording_2021-01-07_12-04-03 ("office loop 5").
#
# Second 4Seasons drive, added for the cross-dataset part of the study.  13746 frames at 30 Hz
# (458 s), 800x400, undistorted frames -- the same geometry as the fs_full drive the project was
# developed on, but a different route, a different day and a different time of day.
#
# Everything but the settings file is an absolute path, so this conf does not care where the
# project lives.  The three dataset files:
#
#   manifest  the SAME file the statistics tool reads (E:/jo_gvil/recover_jo/e1/out/b/*.txt),
#             generated by tools/e1_extract/b_make_manifest.py from undistorted_images/cam0 and
#             times.txt.  Keeping one manifest for both interfaces is deliberate: the estimator and
#             the statistics then cannot disagree about which frames the sequence is.
#   imu       converted from the recording's own imu.txt (t_ns, gx, gy, gz, ax, ay, az, 2000 Hz)
#             by tools/e1_extract/b_make_inputs.py.
#   reference the recording's own GNSS pose solution, GNSSPoses.txt, converted to the
#             "# t_seconds,x,y,z,qx,qy,qz,qw" csv that tools/gauge_free_score.py reads.
#
# Status: the interface is complete and the frontend statistics have been measured on this
# recording.  The estimator itself has NOT been run on it yet -- the calibration is the one that was
# measured for the fs_full drive (same rig; the recordings carry the same TS_cam_imu block to six
# decimals, see conf/openvins_4seasons_office_calib.yaml), so expect the fs_full accuracy class
# (RMS 3D 31 m over 313 s, path ratio 1.023) rather than to inherit those numbers as a result.
#
# Format: "key = value", one per line, '#' starts a comment, keys are case-insensitive.
# settings, output, bag, work_dir resolve against the project root; manifest, imu, reference resolve
# against dataset_root; any path already absolute is used exactly as written.

name = 4Seasons office loop (2021-01-07, 13746 frames, E drive)
engine = openvins
settings = conf/openvins_4seasons_office.yaml
manifest = E:/jo_gvil/recover_jo/e1/out/b/4seasons_office_E.txt
imu = E:/jo_gvil/recover_jo/e1/out/b/4seasons_office/imu.csv
reference = E:/jo_gvil/recover_jo/e1/out/b/4seasons_office/reference.csv
work_dir = E:/jo_gvil/recover_jo/e1/out/b/4seasons_office
dataset_root = E:/driving dataset/COMPUTER VISION GROUP/recording_2021-01-07_12-04-03
frames = 0
start = 0
window = 8
time_scale = 1
output = sol
