# jo_vi_corner -- run configuration for the whole 4Seasons drive.
#
# This is the only configuration in the project, and it runs the full drive: all 9487 frames, about 313 seconds of
# data.  Measured on this window (tools/gauge_free_score.py, reference path 2194.8 m):
#
#   RMS 3D 30.9956 - 31.2342 m over six runs, path ratio 1.023 in every one
#
# Measured run time on the machine this was developed on: **177.6 s** (about 3 minutes, 53 frames per second).  An
# earlier version of this file said 25 minutes, which was an estimate from the kernel this one replaced and was wrong
# by roughly eight times.
#
# `--frames N` on the command line overrides `frames` for a single run without editing this file, which is the cheap
# way to check a change: 900 frames take 37.5 s against the full drive's 178 s.
#
# Format: "key = value", one per line, '#' starts a comment, keys are case-insensitive.  How paths resolve, and why
# the two groups differ:
#
#   settings, output, bag, work_dir   relative to the project root (the directory containing bin/, conf/ and sol/)
#   manifest, imu, reference          relative to dataset_root, because those are dataset files and moving the
#                                     dataset should not mean editing three paths
#   any path already absolute         used exactly as written, so a configuration can also point straight at a
#                                     dataset somewhere else
#
# These paths are the ones of the machine this was developed on.  Nothing else needs changing to run elsewhere
# except them, and the four dependency roots that build_msvc.bat takes.

name = 4Seasons full drive (all 9487 frames)

# Which estimator to run.  The application picks the matching executable out of bin/ and builds the argument list for
# it.  Only "openvins" exists in this repository; the value is kept because the application reads it.
engine = openvins

# --- algorithm configuration ----------------------------------------------------------------------------------
# For the OpenVINS engine this is that kernel's own YAML, which in turn names two calibration files beside it:
# openvins_4seasons_calib.yaml (camera intrinsics and the camera-IMU extrinsic) and openvins_4seasons_imu.yaml
# (the IMU noise model).  Both are required -- the parser asks for them under separate keys.
settings = conf/openvins_4seasons.yaml

# --- dataset --------------------------------------------------------------------------------------------------
# The whole 4Seasons drive.  The bag is named so the dataset can be re-extracted if the extracted images are ever
# lost -- while the manifest exists the bag is not touched, because turning 3.3 GB into ~9500 PNGs takes minutes and
# should happen once.  Delete the manifest to force a re-extract.  Paths resolve as described at the top of the file:
# manifest/imu/reference against dataset_root, everything else against the project root.
bag = E:/jo_gvil/4seasons/fourseasons.bag
work_dir = E:/jo_gvil/jo_gvil 1.0/build/inputs/fs_full
dataset_root = E:/jo_gvil/jo_gvil 1.0
manifest = build/inputs/fs_full.txt
imu = build/inputs/fs_full/imu.csv
# Ground truth, only for scoring the output afterwards.  Columns: t_seconds,x,y,z,qx,qy,qz,qw
reference = build/inputs/fs_ref_full.csv

# --- run ------------------------------------------------------------------------------------------------------
# 0 means every frame in the manifest: this configuration exists to process the whole drive.
frames = 0
start = 0
# The kernel's sliding window is a setting in the YAML above, not a command line option, so this is inert here.  It is
# still read and reported when the application describes the configuration.
window = 8
# Timestamp unit of the produced trajectory, for the scorer: the driver writes seconds.
time_scale = 1

# The initialiser decides between converging and diverging on this drive, and it solves with Ceres.  Its thread count
# is pinned to 1 in conf/openvins_4seasons.yaml, and the application pins OMP_NUM_THREADS=1 for the driver it starts.
# With four threads the same configuration and input produced both 31.21 m and 3099.18 m on different runs -- see
# docs/STATUS.md, "Why the run was bimodal".

# --- output ---------------------------------------------------------------------------------------------------
output = sol
