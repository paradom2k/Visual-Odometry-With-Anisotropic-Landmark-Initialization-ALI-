# ali-vins -- 4Seasons office_loop_5 (recording_2021-01-07_12-04-03, 13746 frames).
#
# The images are the undistorted cam0 frames of that recording.  The manifest was generated for
# the earlier project with the same sequence; only its recording root needed changing from D: to
# E: on this machine.  The IMU is the converted csv from the earlier experiment inputs; it is
# absolute because it is 83 MB and should not be copied into the repository.
#
# ALI is enabled by default in the driver (OV_WEIGHT=l2cov).  To run the unweighted baseline,
# set OV_WEIGHT= (empty) in the environment before starting the driver.

name = 4Seasons office_loop_5 (2021-01-07, 13746 frames)
engine = openvins
settings = config/openvins_4seasons_office.yaml

manifest = config/data/office_loop_5_manifest.txt
imu = E:/jo_gvil/recover_jo/e1/out/b/4seasons_office/imu.csv
reference = config/data/office_loop_5_reference.csv

dataset_root = .
frames = 0
start = 0
window = 8
max_features = 600
time_scale = 1
output = sol
