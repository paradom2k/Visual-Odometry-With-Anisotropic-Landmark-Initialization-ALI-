# ali-vins -- 4Seasons neighborhood_3 (recording_2020-10-07_14-53-52, 9487 frames).
#
# This is the sequence the project calls fs_full in the earlier notes.  The images are the
# already-extracted fs_full frames; the manifest points at them by absolute path.  The IMU is
# the converted csv (t_seconds,gx,gy,gz,ax,ay,az), also absolute because it is 58 MB and should
# not be copied into the repository.  The reference is local so the scorer works out of the box.
#
# ALI is enabled by default in the driver (OV_WEIGHT=l2cov).  To run the unweighted baseline,
# set OV_WEIGHT= (empty) in the environment before starting the driver.

name = 4Seasons neighborhood_3 (2020-10-07, 9487 frames)
engine = openvins
settings = config/openvins_4seasons.yaml

manifest = config/data/neighborhood_3_manifest.txt
imu = E:/jo_gvil/jo_gvil 1.0/build/inputs/fs_full/imu.csv
reference = config/data/neighborhood_3_reference.csv

# All dataset-relative keys resolve against this root; the paths above are absolute where they
# point outside the project, so "." is enough.
dataset_root = .
frames = 0
start = 0
window = 8
max_features = 600
time_scale = 1
output = sol
