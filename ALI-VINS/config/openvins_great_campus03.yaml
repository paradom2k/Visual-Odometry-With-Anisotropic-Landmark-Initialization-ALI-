%YAML:1.0
# OpenVINS estimator configuration for the GICI open dataset (all 12 scenarios share it).
#
# Modelled on openvins_4seasons.yaml -- same estimator block and the same reasoning, documented there
# -- with the four changes the dataset forces:
#
#   1. calibration and IMU files are GICI's (752x480, radtan distortion because these are the raw lens
#      images, T_I_C as written; the onboard BMI088 at 399.9 Hz, decoded from imu.bin by
#      tools/e1_extract/gici_imu_extract.py).
#   2. gravity_mag 9.7940, the normal gravity at the dataset's latitude (Shanghai, 31 deg N), instead
#      of Munich's 9.8409.
#   3. max_clones 15, i.e. 1.5 s at the 10 Hz camera.  The 4Seasons lesson applies directly: what
#      matters is the clone window's length in seconds, because it is the triangulation baseline, and
#      11 clones at 30 Hz (0.36 s) was short enough to leave the scale unobservable.  At 10 Hz, 15
#      clones give 1.5 s, over which the vehicle covers 10-20 m -- a solid baseline.
#   4. init_dyn_mle_max_time 5.0 with max_iter 50: the iteration cap, not a wall-clock cap, must be
#      what stops the initialisation solve, otherwise the initial state depends on machine load (see
#      the note in openvins_4seasons.yaml).
#
# The camera-IMU transform's DIRECTION is the one open question: the 4Seasons rig needed the inverse
# of what its key said, decided by measurement.  Here T_I_C is used as written ("the pose of the
# camera in the IMU frame", which is what the key asks for); a run whose trajectory is grossly wrong
# in this dataset should try the inverse before anything else.
relative_config_imucam: openvins_great_campus03_calib.yaml
relative_config_imu: openvins_great_campus03_imu.yaml

verbosity: "INFO"

# FEJ off.  Measured on the three scenarios, same windows: with FEJ on the path ratios were 2.35 (1.1),
# 1.028 (2.1) and 1.36 (4.2); with FEJ off 1.228, 1.023 and 1.219.  FEJ freezes the linearisation points
# at the initial estimates, which locks in an early scale error instead of letting the updates remove it.
use_fej: false
integration: "rk4"
use_stereo: false
max_cameras: 1
max_clones: 25
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1
gravity_mag: 9.7940
feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"
num_aruco: 0
record_timing_information: false
record_timing_filepath: "sol/openvins_timing.txt"

calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

# --- initialisation -----------------------------------------------------------------------------------------
# Determinism AND convergence.  The dynamic initialiser's Ceres solve is bounded both by iterations
# (init_dyn_mle_max_iter) and by wall-clock time (init_dyn_mle_max_time).  With the old 0.05 s time cap the
# truncation point depended on machine load, and identical commands produced different trajectories (on
# fs_full's first 350 frames: 1.3 m spread in the first position; on the test recording, runs that produced
# nothing at all).  With the cap raised but the ITERATION limit left at 50, the solve stopped before
# converging on the harder windows: the test recording then scored a path ratio of 4.87 over 200 s against
# 1.05 with 200 iterations.  So: 200 iterations, and a 5 s time cap that the iteration cap always beats
# (~1 ms per iteration), which keeps the answer independent of machine load.
init_dyn_use: true
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 200
init_dyn_mle_max_time: 5.0
init_dyn_mle_max_threads: 1
init_dyn_num_pose: 10
init_dyn_min_deg: 5.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1.0e-12
init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]
# --- initialisation window (see the note above) ---
# Initialisation window.  A 2 s window in this scenario's slow, low-excitation stretch produced a
# converged initial state whose RECOVERED COVARIANCE was still untrustworthy: the same velocity and
# gravity as the 50-iteration run, but the filter then started 1.4x too fast and ran away (path ratio
# 13.2).  Four seconds with 10 poses and up to 400 features gives the MLE enough constraints for a
# covariance the filter can start from: the same window now scores RMS 3D 7.64 m, path ratio 1.076,
# with the 200-iteration initialiser.  The window is a per-dataset property (it must cover enough motion),
# like the clone window: see the note in openvins_gici.yaml.
init_window_time: 4.0
init_imu_thresh: 0.5
init_max_disparity: 0.1
init_max_features: 400

try_zupt: false
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false
zupt_chi2_multipler: 1

use_klt: true
use_mask: false
use_aruco: false
downsize_aruco: false
num_pts: 300
fast_threshold: 20
grid_x: 6
grid_y: 4
min_px_dist: 15
downsample_cameras: false
histogram_method: "CLAHE"
knn_ratio: 0.70
track_frequency: 20.0
num_opencv_threads: 1
multi_threading_pubs: false
multi_threading_subs: false

up_msckf_sigma_px: 1.0
up_msckf_chi2_multipler: 1.0
up_slam_sigma_px: 1.0
up_slam_chi2_multipler: 1.0
up_aruco_sigma_px: 1.0
up_aruco_chi2_multipler: 1.0

sim_seed_state_init: 0
sim_seed_preturb: 0
sim_seed_measurements: 0
sim_do_perturbation: false
sim_traj_path: ""
sim_distance_threshold: 1.5
sim_freq_cam: 10
sim_freq_imu: 400
sim_min_feature_gen_dist: 2.0
sim_max_feature_gen_dist: 5.0
