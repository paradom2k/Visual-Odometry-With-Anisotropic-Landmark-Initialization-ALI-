# ali-orbslam3 -- 4Seasons neighborhood_3 (recording 2020-10-07_14-53-52), monocular plus inertial.
#
# 9487 undistorted cam0 frames at 30 Hz and a 2000 Hz IMU.  Only cam0 is read, matching the
# single-camera setup of the OpenVINS experiments this project's ALI work started from.
#
# The images and the IMU come from different places on purpose: the PNGs are the dataset's undistorted
# extraction (the calibration that matches undistorted_calib_0.txt exactly) and the IMU stream is that
# recording's own /imu_raw, converted to a CSV at its native 2000 Hz.  `input` and `imu` are separate keys
# so a run can take one from each; `imu = <file>.bag` with `imu_topic` would read the stream from the bag
# instead, and is what the sibling project used for this recording.
#
# ALI is the project's isotropic/anisotropic switch: `ali = on` weighs each triangulation by the 2x2 pixel
# covariance of its two keypoints, `ali = off` is stock ORB-SLAM3.  The run prints which one it used.

name = 4Seasons neighborhood_3 (recording 2020-10-07_14-53-52) (mono-inertial)
mode = stereo-inertial
input = images
images_dir = E:/jo_gvil/4seasons/undistorted_images/cam0

images_right_dir = E:/jo_gvil/4seasons/undistorted_images/cam1

camera_right_model = pinhole
camera_right_fx = 501.4757919305817
camera_right_fy = 501.4757919305817
camera_right_cx = 421.7953735163109
camera_right_cy = 167.65799492501083
camera_right_width = 800
camera_right_height = 400
camera_right_distortion = 0 0 0 0
baseline = 0.3004961618953472

# Undistorted (rectified) pinhole camera, from calibration/undistorted_calib_0.txt.
camera_model = pinhole
camera_fx = 501.4757919305817
camera_fy = 501.4757919305817
camera_cx = 421.7953735163109
camera_cy = 167.65799492501083
camera_width = 800
camera_height = 400
camera_distortion = 0 0 0 0
camera_fps = 30

# T_b_c1 (camera pose in the IMU frame) = inverse of the dataset's T_cam_imu.  Row-major rotation.
# det = 1, orthonormal to 1e-15.
r_bc = -0.999885224264 -0.006890161860 0.013493108152 -0.013522961079 0.004304637029 -0.999899294741 0.006831385051 -0.999966997340 -0.004397318352
t_bc = 0.176201487437 -0.055744065125 0.002235492417

# --- inertial input: the recording's own stream, at its native 2000 Hz -------------------------------
# The CSV is `t,gx,gy,gz,ax,ay,ax` in seconds and SI units.  Writing 200 here instead of 2000 (the
# per-sample noise conversion, and the rate the settings file declares) is a factor of ten in the inertial
# model and was measured to destabilise the monocular-inertial tracker.
imu = E:/jo_gvil/jo_gvil 1.0/build/inputs/fs_full/imu.csv
imu_frequency = 2000.0
imu_time_shift = -4.926753519571215e-06
imu_gyro_unit = rad/s
imu_accel_unit = m/s^2
# ORB-SLAM3's own EuRoC values.  On this recording they were measured better than the recording's
# published numbers; see the sibling project's configuration for the comparison table.
imu_noise_gyro = 1.7e-4
imu_noise_acc = 2.0e-3
imu_gyro_walk = 1.9393e-5
imu_acc_walk = 3.0e-3
# A car rarely changes its average acceleration by 0.5 m/s^2 between two frames; this opens the gate.
imu_fast_init = on
# OFF: upstream discards the active map on the first failed local-map track while the inertial unit is
# still initialising, and the initialisation needs two seconds and ten keyframes that it then never
# accumulates.  Measured here as the difference between a run and a reset loop.
imu_reset_map_if_not_initialized = off
# While the IMU is not initialised, also try Relocalization() before declaring the map dead.
relocalize_before_imu_init = on
# Off: the periodic scale re-estimation has a catastrophic mode on this recording (a small scale at the
# first refinement destroys the map) and buys about 13 % more poses in the median run.  See the sibling
# project's notes; the value is per recording.
scale_refinement = off
# The monocular initialiser's disparity gate: mean disparity of the matched points, 8 px.
min_initial_parallax = 8.0
min_initial_parallax_statistic = mean

# --- front end ---------------------------------------------------------------------------------------
# 2000, not 1000: at 1000 a monocular map here holds ~19 points per keyframe and the inlier count sits
# just above the 30 that TrackLocalMap demands, so any perturbation destroys the map.  At 2000 the same
# drive produced one map and no local-map failures (measured over the full sequence).
vocabulary = E:/jo_gvil/jo_gvil 1.0/build/ORBvoc.txt
features = 2000
scale_factor = 1.2
levels = 8
ini_th_fast = 12
min_th_fast = 3

# OFF.  Decoding on its own thread lets the tracker run ahead of LocalMapping; on these monocular runs the
# local map then starves and the tracker is declared lost (measured on the full drive: with prefetch on,
# 38 map recreations and 5371 "Fail to track local map"; off, one map and none).  The decode is only a few
# milliseconds per frame here, so the speed it buys is not worth the map it costs.
prefetch_frames = on

# ALI: on = anisotropic landmark initialisation, off = stock ORB-SLAM3.
ali = off

start_frame = 0
duration = 0
debug_every = 200

# Score this run against the dataset ground truth (yaw+translation alignment, scale fixed at 1):
#   python tools/gauge_free_score.py --est sol/4seasons_neighborhood_3.txt --ref conf/data/neighborhood_3_reference.csv --time-scale 1

reference = conf/data/neighborhood_3_reference.csv
